<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toolbox</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Toolbox</h1>
    </header>

    <div class="tablist" role="tablist" aria-label="Design sections">
      <button class="tab" id="tab-link-force" role="tab" aria-selected="true" aria-controls="panel-link-force" type="button">Link Force</button>
      <button class="tab" id="tab-section-2" role="tab" aria-selected="false" aria-controls="panel-section-2" tabindex="-1" type="button">Sagitta</button>
      <button class="tab" id="tab-section-3" role="tab" aria-selected="false" aria-controls="panel-section-3" tabindex="-1" type="button">Spring Rate</button>
    </div>

    <main class="panels">
      <section class="panel" id="panel-link-force" role="tabpanel" aria-labelledby="tab-link-force">
        <div class="split">
          <form class="inputs" action="#" onsubmit="return false;">
            <label>
              Theta
              <input type="text" name="theta" value="20" placeholder="degrees from frame, top view" autocomplete="off">
            </label>
            <label>
              Force (Lateral)
              <input type="text" name="force" placeholder="Force (Unitless)" autocomplete="off">
            </label>
            <button id="update-plot" type="button">Update</button>
            <div class="results" id="results" aria-live="polite"></div>
          </form>
          <div class="plot">
            <p class="plot-title" id="plot-title"></p>
            <svg id="link-plot" role="img" aria-labelledby="plot-title"></svg>
            <ul class="plot-key">
              <li><span class="swatch frame"></span>0° — Frame reference</li>
              <li><span class="swatch axle"></span>Axle</li>
              <li><span class="swatch link"></span>Link</li>
            </ul>
          </div>
        </div>
      </section>

            <section class="panel" id="panel-section-2" role="tabpanel" aria-labelledby="tab-section-2" hidden>
        <div class="split">
          <form class="inputs" action="#" onsubmit="return false;">
            <label>
              Radius
              <input type="text" id="sagitta-radius" value="10" placeholder="radius" autocomplete="off">
            </label>
            <label>
              Chord
              <input type="text" id="sagitta-chord" value="8" placeholder="chord length" autocomplete="off">
            </label>
            <button id="sagitta-update" type="button">Update</button>
            <div class="results" id="sagitta-results" aria-live="polite"></div>
          </form>
          <div class="plot">
            <p class="plot-title" id="sagitta-plot-title"></p>
            <svg id="sagitta-plot" role="img" aria-labelledby="sagitta-plot-title"></svg>
            <ul class="plot-key">
              <li><span class="swatch frame"></span>Radius</li>
              <li><span class="swatch axle"></span>Chord (Travel)</li>
              <li><span class="swatch link"></span>Sagitta</li>
            </ul>
          </div>
        </div>
      </section>

            <section class="panel" id="panel-section-3" role="tabpanel" aria-labelledby="tab-section-3" hidden>
        <div class="split">
          <form class="inputs" action="#" onsubmit="return false;">
            <div id="spring-inputs">
              <label><input type="text" class="spring-rate" placeholder="Spring rate (lb/in)"></label>
              <label><input type="text" class="spring-rate" placeholder="Spring rate (lb/in)"></label>
            </div>
            <label>
              Spring Angle
              <input type="text" id="spring-angle" value="0" placeholder="degrees from vertical">
            </label>
            <button id="spring-update" type="button">Update</button>
            <div class="results" id="spring-results" aria-live="polite"></div>
          </form>
          <div class="plot">
            <p class="plot-title" id="spring-plot-title"></p>
            <svg id="spring-plot" role="img" aria-labelledby="spring-plot-title"></svg>
            <ul class="plot-key">
              <li><span class="swatch frame"></span>Spring 1</li>
              <li><span class="swatch axle"></span>Spring 2</li>
              <li><span class="swatch link"></span>Vector</li>
            </ul>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
